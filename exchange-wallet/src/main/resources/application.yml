server:
  port: 18082 # 服务端口

spring:
  application:
    name: exchange-wallet # 服务名
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/iexchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai # 数据库地址
    username: root # 数据库用户名
    password: root # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver # JDBC 驱动
  data:
    redis:
      host: 127.0.0.1 # Redis 地址
      port: 6379 # Redis 端口
      database: 0 # Redis 库编号
      timeout: 2000ms # 连接超时
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # Nacos 注册中心地址
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858 # Sentinel 控制台地址
      eager: true # 启动即连接控制台

dubbo:
  application:
    name: exchange-wallet-dubbo # Dubbo 应用名（与 Spring 服务名区分）
    metadata-type: remote # 元数据使用远程模式
    qos-enable: true # 开启 QoS 管理端口
    qos-port: 22222 # QoS 端口（避免冲突）
  registry:
    address: nacos://127.0.0.1:8848?group=DUBBO_GROUP&namespace=dubbo # Dubbo 使用 Nacos 作为注册中心
  metadata-report:
    address: nacos://127.0.0.1:8848?group=DUBBO_GROUP&namespace=dubbo # Dubbo 元数据上报到 Nacos
  protocol:
    host: 127.0.0.1
    name: dubbo # 使用 Dubbo 协议
    port: 20881 # 固定端口，避免随机端口导致注册信息漂移
    accesslog: true #Dubbo 访问日志。
  consumer:
    check: false # 启动时不强制检查提供者
  scan:
    base-packages: com.iexchange.wallet # 扫描 Dubbo 服务

seata:
  enabled: false # 启用 Seata
  data-source-proxy-mode: AT # 显式使用 AT 模式
  application-id: exchange-wallet # Seata 应用标识
  tx-service-group: exchange_tx_group # 全局事务分组名
  registry:
    type: nacos # 使用 Nacos 注册中心
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 地址
      group: SEATA_GROUP # Nacos 分组
      namespace: seata # Nacos 命名空间（用于隔离）
      application: seata-server # Seata Server 服务名
      cluster: default # 集群名
  config:
    type: nacos # 使用 Nacos 配置中心
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 地址
      group: SEATA_GROUP # 配置分组
      namespace: seata # Nacos 命名空间（用于隔离）
      data-id: seata-client.properties # 客户端配置 DataId

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
  global-config:
    db-config:
      id-type: auto # 主键自增

springdoc:
  api-docs:
    enabled: true # 开启 OpenAPI 文档
  swagger-ui:
    enabled: true # Knife4j 依赖 swagger-config，需保持开启

knife4j:
  enable: true # 启用 Knife4j UI
  setting:
    language: zh_cn # 中文界面

chain:
  enabled: false # 是否启用链上充提
  name: local # 链名称标识
  rpc-url: http://127.0.0.1:8545 # 本地链 RPC
  chain-id: 1337 # 链 ID（本地链常见 1337/31337）
  confirmations: 1 # 入账确认数
  token:
    address: "" # ERC20 合约地址（部署后填写）
    symbol: IEX # 资产符号
    decimals: 18 # 资产精度
  hot-wallet:
    private-key: "" # 热钱包私钥（留空将自动生成）
    address: "" # 热钱包地址（留空由私钥计算）
  scan:
    interval-ms: 5000 # 扫描间隔
    start-block: 0 # 初始扫描区块
  sweep:
    enabled: false # 是否开启归集
    interval-ms: 15000 # 归集间隔
    min-amount: 0.000001 # 最小归集数量

otc:
  enabled: true # 是否启用 OTC 任务
  scan-interval-ms: 5000 # 扫描间隔
  pay-timeout-minutes: 15 # 买方付款超时（分钟）
  release-timeout-minutes: 30 # 卖方放币超时（分钟）
