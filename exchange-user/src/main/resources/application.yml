server:
  port: 18081 # 服务端口

spring:
  application:
    name: exchange-user # 服务名
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/iexchange?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true # 数据库地址
    username: root # 数据库用户名
    password: root # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver # JDBC 驱动
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # Nacos 注册中心地址
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858 # Sentinel 控制台地址
      eager: true # 启动即连接控制台

dubbo:
  application:
    name: exchange-user-dubbo # Dubbo 应用名（与 Spring 服务名区分）
    metadata-type: remote # 元数据使用远程模式
    qos-enable: true # 开启 QoS 管理端口
    qos-port: 22221 # QoS 端口（避免冲突）
  registry:
    address: nacos://127.0.0.1:8848?group=DUBBO_GROUP&namespace=dubbo # Dubbo 使用 Nacos 作为注册中心
  metadata-report:
    address: nacos://127.0.0.1:8848?group=DUBBO_GROUP&namespace=dubbo # Dubbo 元数据上报到 Nacos
  protocol:
    name: dubbo # 使用 Dubbo 协议
    port: -1 # 随机端口，避免端口冲突
  consumer:
    check: false # 启动时不强制检查提供者
  scan:
    base-packages: com.iexchange.user # 扫描 Dubbo 服务

seata:
  enabled: true # 启用 Seata
  data-source-proxy-mode: AT # 显式使用 AT 模式
  application-id: exchange-user # Seata 应用标识
  tx-service-group: exchange_tx_group # 全局事务分组名
  registry:
    type: nacos # 使用 Nacos 注册中心
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 地址
      group: SEATA_GROUP # Nacos 分组
      namespace: seata # Nacos 命名空间（用于隔离）
      application: seata-server # Seata Server 服务名
      cluster: default # 集群名
  config:
    type: nacos # 使用 Nacos 配置中心
    nacos:
      server-addr: 127.0.0.1:8848 # Nacos 地址
      group: SEATA_GROUP # 配置分组
      namespace: seata # Nacos 命名空间（用于隔离）
      data-id: seata-client.properties # 客户端配置 DataId

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
  global-config:
    db-config:
      id-type: auto # 主键自增

jwt:
  secret: iexchange-demo-secret-please-change-32bytes # JWT 密钥
  issuer: iexchange # JWT 发行者
  expire-seconds: 7200 # Token 过期时间（秒）

springdoc:
  api-docs:
    enabled: true # 开启 OpenAPI 文档
  swagger-ui:
    enabled: true # Knife4j 依赖 swagger-config，需保持开启

knife4j:
  enable: true # 启用 Knife4j UI
  setting:
    language: zh_cn # 中文界面
